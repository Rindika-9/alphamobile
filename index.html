
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Alpha Mobile</title>
      <meta name="description" content="A premium e-commerce platform for mobile phones and electronics offering seamless shopping, order management, and admin analytics for customers and store owners." />
      <meta name="google-site-verification" content="eEblNppEgYpujtL5lL7PX3mJxRirR5PIDcUJGj6e5ko" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
      <!-- PWA Meta Tags -->
      <link rel="manifest" href="/manifest.json" />
      <link rel="apple-touch-icon" href="/icon.png" />
      <meta name="theme-color" content="#0B1D3A" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
      <!-- Register Service Worker -->
      <script>
        // Not inside the Android app (Capacitor serves the files itself).
        var isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        if ('serviceWorker' in navigator && !isNativeApp) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then(reg => console.log('Service Worker registered successfully:', reg))
              .catch(err => console.error('Service Worker registration failed:', err));
          });
        }
      </script>
    </body>
  </html>
